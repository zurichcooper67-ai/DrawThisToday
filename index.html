<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw This Today</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f3f2e7;
  overflow: hidden;
  transition: background 0.6s ease;
}

/* DRAGON BACKGROUND */
#dragon {
  position: fixed;
  width: 220%;
  height: 220%;
  top: -60%;
  left: -50%;
  opacity: 0.7;
  z-index: 0;
  pointer-events: none;
  animation: floatDragon 55s ease-in-out infinite;
}

@keyframes floatDragon {
  0%   { transform: translate(0%, 0%) rotate(0deg) scale(1); }
  25%  { transform: translate(-6%, 3%) rotate(2deg) scale(1.02); }
  50%  { transform: translate(-12%, 6%) rotate(4deg) scale(1.03); }
  75%  { transform: translate(-6%, 3%) rotate(2deg) scale(1.02); }
  100% { transform: translate(0%, 0%) rotate(0deg) scale(1); }
}

/* GLITTER */
#glitterCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
}

/* CENTER BOX */
.container {
  position: relative;
  z-index: 3;
  background: rgba(235,234,210,0.75);
  backdrop-filter: blur(10px);
  padding: 50px 40px;
  border-radius: 18px;
  text-align: center;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  transition: background 0.6s ease;
}

/* TITLE */
h1 {
  font-family: serif;
  letter-spacing: 1px;
  color: #7f8f6a;
  margin-bottom: 10px;
}

/* PROMPT */
.prompt {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 1px;
  margin: 40px 0;
  color: #5f6f52;
}

/* BUTTON */
button {
  background: #c7d1a8;
  border: none;
  padding: 14px 24px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Bebas Neue';
  font-size: 16px;
  transition: all .25s ease;
}

button:hover {
  background: #b4c092;
  transform: translateY(-2px);
}

/* DARK MODE */
body.dark {
  background: #2f3326;
}

body.dark .container {
  background: rgba(70,80,50,0.75);
}

body.dark h1 { color: #b7c7a2; }
body.dark .prompt { color: #d6e2c2; }

/* EYE TOGGLE */
#toggle {
  position: absolute;
  top: 18px;
  right: 18px;
  cursor: pointer;
  font-size: 18px;
  opacity: .6;
}
</style>
</head>

<body>

<!-- ASIAN DRAGON -->
<svg id="dragon" viewBox="0 0 1200 800" fill="none" stroke="#556b2f" stroke-width="7" stroke-linecap="round">
  <path d="M100,500 C200,300 400,300 500,500 S800,700 900,500 S1100,300 1000,150 S700,50 600,200 S400,450 300,350 S150,250 100,500"/>
  <path d="M980,150 C1040,120 1100,140 1150,110" stroke-width="4"/>
  <path d="M980,170 C1040,200 1100,200 1160,230" stroke-width="4"/>
  <path d="M960,130 L990,60" stroke-width="5"/>
</svg>

<canvas id="glitterCanvas"></canvas>

<div class="container">
  <div id="toggle">◐</div>
  <h1>Draw This Today</h1>
  <div id="prompt" class="prompt"></div>
  <button onclick="generatePrompt()">Generate New Prompt</button>
</div>

<script>
/* PROMPTS */
const prompts = [
"Draw a city inside a tree",
"Draw a floating temple",
"Draw a spirit creature",
"Draw a forgotten ruin",
"Draw a mountain village in the clouds",
"Draw a mythical landscape",
"Draw a character made of wind",
"Draw a world inside a jar",
"Draw a calm sacred place",
"Draw an ancient guardian"
];

const today = new Date();
let currentIndex = today.getDate() % prompts.length;
document.getElementById("prompt").innerText = prompts[currentIndex];

function generatePrompt() {
  let i;
  do { i = Math.floor(Math.random()*prompts.length); }
  while(i === currentIndex);
  currentIndex = i;
  document.getElementById("prompt").innerText = prompts[i];
}

/* DARK MODE */
document.getElementById("toggle").onclick = () =>
  document.body.classList.toggle("dark");

/* GLITTER EFFECT */
const canvas = document.getElementById("glitterCanvas");
const ctx = canvas.getContext("2d");
let particles = [];

function resize(){ canvas.width=innerWidth; canvas.height=innerHeight }
resize(); window.onresize = resize;

document.onmousemove = e=>{
  particles.push({x:e.x,y:e.y,a:1,s:Math.random()*2});
};

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    ctx.fillStyle=`rgba(180,200,160,${p.a})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
    ctx.fill();
    p.a-=0.02;
  });
  particles=particles.filter(p=>p.a>0);
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>

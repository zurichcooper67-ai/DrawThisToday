<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw This Today</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sifonn&display=swap" rel="stylesheet">

<style>
/* Body and base */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: all 0.5s ease;
  overflow: hidden;
  background: #f0f0e5; /* placeholder light background */
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Glitter canvas */
#glitterCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 2;
}

/* Dragon background */
#dragonBg {
  position: fixed;
  top: -20%;
  left: -20%;
  width: 160%;  /* larger than viewport */
  height: 160%;
  opacity: 0.05;
  z-index: 0;
  pointer-events: none;
  animation: dragonDrift 80s linear infinite;
}

@keyframes dragonDrift {
  0% { transform: translate(0%, 0%) rotate(0deg); }
  50% { transform: translate(2%, 3%) rotate(10deg); }
  100% { transform: translate(0%, 0%) rotate(0deg); }
}

/* Container box */
.container {
  position: relative;
  z-index: 3;
  background: rgba(240, 240, 210, 0.85); /* light khaki transparency */
  padding: 50px 40px;
  border-radius: 20px;
  max-width: 480px;
  width: 90%;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  backdrop-filter: blur(8px); /* slightly blur dragon behind */
  transition: all 0.5s ease;
}

/* Title */
h1 {
  font-family: 'Sifonn', sans-serif;
  font-size: 32px;
  margin-bottom: 10px;
  color: #8c9a70; /* pastel sage */
  transition: all 0.5s ease;
}

/* Subtitle */
.subtitle {
  font-size: 14px;
  color: #6e7d50; /* darker pastel for subtitle */
  margin-bottom: 35px;
  transition: all 0.5s ease;
}

/* Prompt */
.prompt {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  line-height: 1.5;
  margin-bottom: 40px;
  min-height: 60px;
  color: #53634b; /* subtle pastel text */
  transition: all 0.5s ease;
}

/* Button */
button {
  font-family: 'Bebas Neue', sans-serif;
  background: #b5c89f; /* pastel sage */
  color: white;
  border: none;
  padding: 14px 24px;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
}

button:hover {
  background: #a1b88a;
  transform: translateY(-2px);
}

/* Footer */
footer {
  margin-top: 35px;
  font-size: 12px;
  color: #7d8b5e;
  transition: all 0.5s ease;
}

/* Dark mode styles */
body.dark {
  background: #3c3d2e;
}

body.dark .container {
  background: rgba(70, 80, 50, 0.85); /* moss green */
}

body.dark h1 { color: #a6b28f; } /* light olive */
body.dark .subtitle { color: #9aa67e; }
body.dark .prompt { color: #c3d2b2; }
body.dark footer { color: #b0c2a0; }

/* Toggle Button */
#modeToggle {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  z-index: 4;
  transition: all 0.5s ease;
}
</style>
</head>

<body>

<!-- Dragon background -->
<img id="dragonBg" src="https://upload.wikimedia.org/wikipedia/commons/5/53/Dragon_line_art.svg" alt="dragon">

<!-- Glitter canvas -->
<canvas id="glitterCanvas"></canvas>

<!-- Toggle -->
<svg id="modeToggle" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="10" stroke="#8c9a70" stroke-width="2" fill="none"/>
  <line x1="8" y1="12" x2="16" y2="12" stroke="#8c9a70" stroke-width="2"/>
</svg>

<div class="container">
  <h1>Draw This Today</h1>
  <div class="subtitle">One prompt. No overthinking.</div>
  <div id="prompt" class="prompt"></div>
  <button onclick="generatePrompt()">Generate New Prompt</button>
  <footer>Open → Draw → Repeat</footer>
</div>

<script>
// Prompts
const prompts = [
"Draw a city inside a tree",
"Draw your favorite food as a character",
"Draw an animal that can fly and swim",
"Draw a peaceful place from your imagination",
"Draw a robot learning to paint",
"Draw a house made of clouds",
"Draw yourself as a cartoon hero",
"Draw a mysterious door in the forest",
"Draw a tiny world inside a jar",
"Draw a creature made of geometric shapes",
"Draw a character made of water",
"Draw a floating island village",
"Draw something that represents calm",
"Draw a futuristic pet",
"Draw a scene using only circles",
"Draw a backpack filled with impossible items",
"Draw a rainy day from memory",
"Draw a hidden world underground",
"Draw a vehicle powered by nature",
"Draw a character made of light"
];

// Daily prompt
const today = new Date();
let currentIndex = today.getDate() % prompts.length;
document.getElementById("prompt").innerText = prompts[currentIndex];

// Random prompt
function generatePrompt() {
  let newIndex;
  do { newIndex = Math.floor(Math.random() * prompts.length); } while (newIndex === currentIndex);
  currentIndex = newIndex;
  document.getElementById("prompt").innerText = prompts[currentIndex];
}

// Glitter
const canvas = document.getElementById('glitterCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
function createParticle(x, y) {
  particles.push({ x, y, size: Math.random()*3+1, speedX: (Math.random()-0.5)*1.5, speedY: (Math.random()-0.5)*1.5, alpha:1 });
}
document.addEventListener('mousemove', e => { for(let i=0;i<3;i++) createParticle(e.clientX,e.clientY); });
function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<particles.length;i++){
    const p = particles[i];
    ctx.fillStyle = `rgba(181,200,159,${p.alpha})`; // pastel glitter (sage)
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    p.x+=p.speedX; p.y+=p.speedY; p.alpha-=0.02;
    if(p.alpha<=0){particles.splice(i,1);i--;}
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

// Dark/light toggle
const toggle = document.getElementById('modeToggle');
toggle.addEventListener('click', ()=>{
  document.body.classList.toggle('dark');
  if(document.body.classList.contains('dark')){
    toggle.innerHTML = `<circle cx="12" cy="12" r="10" stroke="#a6b28f" stroke-width="2" fill="none"/>
    <line x1="8" y1="12" x2="16" y2="12" stroke="#a6b28f" stroke-width="2"/>`;
  } else {
    toggle.innerHTML = `<circle cx="12" cy="12" r="10" stroke="#8c9a70" stroke-width="2" fill="none"/>
    <line x1="12" y1="8" x2="12" y2="16" stroke="#8c9a70" stroke-width="2"/>`;
  }
});
</script>

</body>
</html>
